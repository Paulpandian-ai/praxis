[project]
name = "praxis"
version = "0.1.0"
description = "Agentic asset management platform — multi-agent decision support for portfolio managers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Praxis" }]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "boto3>=1.34",
    "anyio>=4.3",
    "tenacity>=8.2",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "datamodel-code-generator>=0.25",
    "boto3-stubs[essential,bedrock-runtime,bedrock-agent-runtime,s3,dynamodb,secretsmanager]>=1.34",
]

[tool.uv]
package = false

# ---------- Decimal context ----------
# All financial math uses decimal.Decimal (CLAUDE.md §6 rule 10). Default
# context precision and rounding are configured at process start in
# agents/_shared/decimal_context.py (to be added in Phase 1).

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "cdk.out", ".venv", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "ASYNC",         # async correctness
    "S",             # bandit security
    "C90",           # mccabe complexity
    "RUF",           # ruff-specific
    "N",             # pep8-naming
    "PT",            # pytest style
    "SIM",           # simplify
    "TID",           # tidy imports
    "PL",            # pylint subset
]
ignore = [
    "PLR0913",  # too many arguments — agent ctors often legitimately need many
    "PLR2004",  # magic numbers — handled by code review and constants module
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "C90", "PL"]
"**/test_*.py" = ["S", "C90", "PL"]
"evals/**/*.py" = ["S"]
"scripts/**/*.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "mcp_servers", "data", "_shared"]

# ---------- Mypy (strict) ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
exclude = ['^cdk\.out/', '^frontend/', '^\.venv/', '^node_modules/']

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests", "agents", "mcp_servers"]
asyncio_mode = "auto"
markers = [
    "integration: requires the local docker stack",
    "e2e: end-to-end browser tests",
    "slow: tests >1s",
]

# ---------- Coverage ----------
[tool.coverage.run]
branch = true
source = ["agents", "mcp_servers", "data"]
omit = ["*/test_*.py", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
